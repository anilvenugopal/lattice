[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-demo-host"
version = "0.1.0"
description = "A Lattice host that runs the demo app."
requires-python = ">=3.14"
dependencies = ["lattice", "lattice-demo"]

[tool.uv.sources]
lattice = { workspace = true }
lattice-demo = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["demo_host"]
