{# Ctrl+J preview of a command (app/search.py COMMANDS). #}
<div class="panel">
  <header class="panel__head"><div class="panel__title">{{ label }}</div></header>
  <div class="panel__body">
    <p>{{ description }}</p>
    <p class="u-muted u-small">Press <kbd>Enter</kbd> to run.</p>
  </div>
</div>
