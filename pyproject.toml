[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice"
version = "0.1.0"
description = "Lattice: application platform with navigation, Ctrl+J search, auth, admin, preferences and a standard data grid."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "bcrypt",
    "httpx",
    "pyjwt[crypto]",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
]

[project.scripts]
lattice = "lattice.cli:main"

[dependency-groups]
# The demo app and host are installed for development and tests only; the
# lattice package itself never depends on an app.
dev = ["pytest", "ruff", "cryptography", "import-linter", "lattice-demo", "lattice-demo-host"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/*", "hosts/*"]

[tool.uv.sources]
lattice-demo = { workspace = true }
lattice-demo-host = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["lattice"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.isort]
known-first-party = ["lattice", "lattice_demo", "demo_host"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID251"]
ignore = ["E501", "B008"]

# No ORM: every SQL statement is a named query in a .sql file (step 2 plan).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.orm".msg = "No ORM in Lattice: write a named query in a sql/*.sql file and run it with Db."

[tool.pytest.ini_options]
testpaths = ["tests", "apps/demo/tests"]
addopts = "--import-mode=importlib"
# Deprecations fail the tests, so they are fixed when they appear. The one exception
# is in Starlette's own test client, which Lattice does not control.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# Import contracts (ADR 0002), checked by tests/test_import_contracts.py.
[tool.importlinter]
root_packages = ["lattice", "lattice_demo", "demo_host"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Lattice layers: each imports only the layers below it"
type = "layers"
layers = [
    "lattice.cli",
    "lattice.reference | lattice.testing",
    "lattice.api",
    "lattice.host",
    "lattice.platform",
    "lattice.components",
    "lattice.kernel",
]

[[tool.importlinter.contracts]]
name = "Apps import only lattice.api"
type = "forbidden"
source_modules = ["lattice_demo"]
forbidden_modules = [
    "lattice.kernel", "lattice.components", "lattice.platform", "lattice.host", "lattice.testing",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Apps reach the database only through lattice.api"
type = "forbidden"
source_modules = ["lattice_demo", "demo_host"]
forbidden_modules = ["sqlalchemy", "psycopg"]
allow_indirect_imports = true
